<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personnes | RH</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f4f7fb; color: #172033; }
        main { max-width: 1100px; margin: 0 auto; padding: 48px 24px; }
        h1 { margin: 0 0 8px; font-size: 2rem; }
        .subtitle { margin: 0 0 28px; color: #60708a; }
        .table-wrapper { overflow-x: auto; background: #fff; border: 1px solid #dce3ee; border-radius: 8px; box-shadow: 0 8px 24px rgba(23, 32, 51, .06); }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #e8edf4; }
        th { background: #172033; color: #fff; font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; }
        tr:last-child td { border-bottom: 0; }
        .empty { padding: 32px; text-align: center; color: #60708a; }
        @media (max-width: 640px) { main { padding: 32px 16px; } h1 { font-size: 1.6rem; } th, td { padding: 13px 14px; } }
    </style>
</head>
<body>
<main>
    <h1>Personnes</h1>
    <p class="subtitle" th:text="${persons.size()} + ' personne(s) enregistrée(s)'">0 personne enregistrée</p>

    <div class="table-wrapper" th:if="${!persons.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Date de naissance</th>
                <th>Créée le</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="person : ${persons}">
                <td th:text="${person.lastName}">Doe</td>
                <td th:text="${person.firstName}">John</td>
                <td th:text="${person.email}">john.doe@example.com</td>
                <td th:text="${person.dateOfBirth != null ? #temporals.format(person.dateOfBirth, 'dd/MM/yyyy') : '-'}">01/01/1990</td>
                <td th:text="${person.createdAt != null ? #temporals.format(person.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">01/01/2026 12:00</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="empty" th:unless="${!persons.isEmpty()}">Aucune personne à afficher.</p>
</main>
</body>
</html>
