<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appli RH - Offres d'emploi</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" th:href="@{/home}">
                <span class="brand-mark">RH</span>
                <span><strong>Appli RH</strong></span>
            </a>
            <div class="topbar-actions">
                <span class="status">
                    <span class="status-dot"></span>
                    <span th:text="${employeeConnecte.prenom + ' ' + employeeConnecte.nom}">Utilisateur connecté</span>
                </span>
                <span class="avatar"
                      th:text="${#strings.substring(employeeConnecte.prenom, 0, 1) + #strings.substring(employeeConnecte.nom, 0, 1)}">UC</span>
                <a th:href="@{/logout}">Déconnexion</a>
            </div>
        </header>

        <div class="workspace">
            <div th:replace="~{pages/components/navbar :: nav}"></div>

            <main class="content">
                <section class="content-section">
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow">Bloc 2 - Recrutement</p>
                            <h1>Offres d'emploi</h1>
                            <p class="intro">Publiez, présélectionnez et suivez les candidats jusqu'à la décision finale.</p>
                        </div>
                    </div>

                    <div class="postes">
                        <article class="poste" th:each="offre : ${listeOffres}">
                            <div class="poste-icon" th:text="${offre.titre != null and offre.titre.length() >= 2 ? #strings.toUpperCase(offre.titre.substring(0, 2)) : 'OF'}">OF</div>
                            <div class="poste-details">
                                <h2 th:text="${offre.titre}">Intitulé de l'offre</h2>
                                <p th:text="${offre.description}">Description de l'offre</p>
                                <p th:text="${'Publication : ' + offre.datePublication}">Date de publication</p>
                            </div>
                            <span class="poste-status" th:text="${offre.statut}">Publiee</span>
                            <a class="button button-secondary" th:if="${offre.statut != 'Termine'}" th:href="@{/offres/{offreId}/candidatures(offreId=${offre.id})}">Candidatures</a>
                            <a class="button button-secondary" th:if="${offre.statut == 'Termine'}" th:href="@{/offres/{offreId}/entretiens-termine(offreId=${offre.id})}">Entretiens</a>
                            <form method="post"
                                  th:action="@{/offres/{offreId}/terminer(offreId=${offre.id})}"
                                  onsubmit="return confirm('Voulez-vous terminer cette offre et afficher les candidatures présélectionnées ?');">
                                <button class="button button-primary" type="submit" th:if="${offre.statut != 'Termine'}">Terminer l'offre</button>
                            </form>
                        </article>
                    </div>

                    <!-- <div class="panel recruitment-create-panel">
                        <div class="panel-heading">
                            <h2>Créer une offre à partir d'une demande validée</h2>
                        </div>

                                            th:value="${demande.id}"

                                </select>
                            </label>

                                <input type="date" name="dateCloture">
                            </label>
                            <button class="button button-primary" type="submit">Publier l'offre</button>
                        </form>
                    </div> -->
                </section>

            </main>
        </div>
    </div>
</body>
</html>
