<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appli RH - Nouvelle offre</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" th:href="@{/home}">
                <span class="brand-mark">RH</span>
                <span><strong>Appli RH</strong></span>
            </a>
            <div class="topbar-actions">
                <span class="status">
                    <span class="status-dot"></span>
                    <span th:text="${employeeConnecte.prenom + ' ' + employeeConnecte.nom}">Utilisateur connecté</span>
                </span>
                <span class="avatar"
                      th:text="${#strings.substring(employeeConnecte.prenom, 0, 1) + #strings.substring(employeeConnecte.nom, 0, 1)}">UC</span>
                <a th:href="@{/logout}">Déconnexion</a>
            </div>
        </header>

        <div class="workspace">
            <div th:replace="~{pages/components/navbar :: nav}"></div>

            <main class="content">
                <section class="content-section">
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow">Bloc 2 - Recrutement</p>
                            <h1>Proposer une nouvelle offre</h1>
                            <p class="intro">Modifiez le salaire proposé pour cette candidature.</p>
                        </div>
                        <a class="button button-secondary"
                           th:href="@{/negociation/fiche/{candidatureId}(candidatureId=${candidature.id})}">
                            Retour à la candidature
                        </a>
                    </div>

                    <section class="panel">
                        <div class="panel-heading">
                            <h2>Informations de l'offre</h2>
                        </div>

                        <form class="position-form" th:action="@{/negociation/proposer/{candidatureId}(candidatureId=${candidature.id})}" method="post">
                            <label for="nom">
                                Nom
                                <input id="nom" name="nom" type="text" th:value="${candidature.candidat.nom}" readonly>
                            </label>

                            <label for="prenom">
                                Prénom
                                <input id="prenom" name="prenom" type="text" th:value="${candidature.candidat.prenom}" readonly>
                            </label>

                            <label for="telephone">
                                Téléphone
                                <input id="telephone" name="telephone" type="tel" th:value="${candidature.candidat.telephone}" readonly>
                            </label>

                            <label for="email">
                                Email
                                <input id="email" name="email" type="email" th:value="${candidature.candidat.email}" readonly>
                            </label>

                            <label for="typeContrat">
                                Type de contrat
                                <input id="typeContrat" name="typeContrat" type="text" th:value="${contrat.typeContrat.libelle}" readonly>
                            </label>

                            <label for="dateDebut">
                                Date de début
                                <input id="dateDebut" name="dateDebut" type="text" th:value="${contrat.dateDebut}" readonly>
                            </label>

                            <label for="dateFin" th:if="${contrat.dateFin != null}">
                                Date de fin
                                <input id="dateFin" name="dateFin" type="text"
                                       th:value="${contrat.dateFin != null ? contrat.dateFin : ''}" readonly>
                            </label>

                            <label for="salaire">
                                Salaire
                                <input id="salaire" name="salaire" type="number" step="0.01"
                                       th:value="${contrat.salaire}" th:attr="max=${budgetPoste}">
                                <small th:if="${budgetPoste != null}"
                                       th:text="${'Budget maximum par salarié : ' + budgetPoste}"></small>
                            </label>

                            <button class="offer-button" type="submit">Proposer la nouvelle offre</button>
                        </form>
                    </section>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
