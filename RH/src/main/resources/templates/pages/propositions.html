<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appli RH - Propositions</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" th:href="@{/home}">
                <span class="brand-mark">RH</span>
                <span><strong>Appli RH</strong></span>
            </a>
            <div class="topbar-actions">
                <span class="status">
                    <span class="status-dot"></span>
                    <span th:text="${employeeConnecte.prenom + ' ' + employeeConnecte.nom}">Utilisateur connecté</span>
                </span>
                <span class="avatar"
                      th:text="${#strings.substring(employeeConnecte.prenom, 0, 1) + #strings.substring(employeeConnecte.nom, 0, 1)}">UC</span>
                <a th:href="@{/logout}">Déconnexion</a>
            </div>
        </header>

        <div class="workspace">
            <div th:replace="~{pages/components/navbar :: nav}"></div>

            <main class="content">
                <section class="content-section">
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow">Bloc 2 - Recrutement</p>
                            <h1>Negociation</h1>
                            <p class="intro">Propositions des candidats en cours de négociation.</p>
                        </div>
                        <a class="button button-secondary" th:href="@{/offres}">Retour aux offres</a>
                    </div>

                    <div class="postes">
                        <article class="poste" th:each="candidature : ${listeCandidatures}">
                            <div class="poste-icon"
                                 th:text="${candidature.candidat.prenom.substring(0, 1) + candidature.candidat.nom.substring(0, 1)}">
                                CN
                            </div>
                            <div class="poste-details">
                                <h2 th:text="${candidature.candidat.prenom + ' ' + candidature.candidat.nom}">
                                    Candidat
                                </h2>
                                <p th:text="${candidature.candidat.email + ' - ' + candidature.candidat.telephone}">
                                    Coordonnées
                                </p>
                                <p th:text="${'Offre : ' + candidature.offre.titre}">Offre</p>
                                <p th:text="${'Candidature reçue le ' + candidature.dateCandidature}">Date</p>
                            </div>
                            <span class="poste-status" th:text="${candidature.etat.libelle}">Proposee</span>
                        </article>
                        <p th:if="${#lists.isEmpty(listeCandidatures)}">
                            Aucune candidature proposée pour le moment.
                        </p>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
