<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appli RH - Offres disponibles</title>
    <link rel="stylesheet" th:href="@{/css/offres-public.css}">
</head>
<body>
    <main class="offers-page">
        <header class="public-header">
            <a class="public-brand" th:href="@{/}">
                <span class="public-brand-mark">RH</span>
                <strong>Appli RH</strong>
            </a>
            <a class="login-button" th:href="@{/}">Voir liste des offres</a>
        </header>

        <header class="offers-header">
            <div>
                <p class="eyebrow">Appli RH</p>
                <h1>Liste des offres d'embauche</h1>
            </div>
        </header>

        <section class="offers-section" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
            <!-- Formulaire d'email stylé -->
            <div style="background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 30px;">
                    <label for="email" style="font-weight: 500; color: #333;">Votre email :</label>
                    <input type="email" name="email" id="email" placeholder="votre@email.com" style="padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; flex: 1; min-width: 200px;">
                    <button type="button" onclick="fetchOffres()" style="background-color: #0f172a; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-left: 10px;">Voir les offres</button>
            </div>

            <div id="offers-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;"></div>
        </section>

        <!-- <p class="empty-state" th:if="${#lists.isEmpty(listeOffres)}">Aucune offre n'est disponible pour le moment.</p> -->
    </main>

    <script>
        function fetchOffres() {
            fetch('/api/propositions/' + document.getElementById('email').value)
                .then(response => response.json())
                .then(data => {
                    const offersGrid = document.getElementById('offers-grid');
                    offersGrid.innerHTML = ''; // Clear existing offers

                    if (data.length === 0) {
                        const emptyMessage = document.createElement('p');
                        emptyMessage.textContent = "Aucune offre n'est disponible pour le moment.";
                        emptyMessage.style.textAlign = 'center';
                        emptyMessage.style.color = '#64748b';
                        emptyMessage.style.fontSize = '16px';
                        offersGrid.appendChild(emptyMessage);
                    } else {
                        for (const candidature of data) {
                            afficherArticle(candidature);
                        }
                    }
                })
                .catch(error => console.error('Erreur lors de la récupération des offres :', error));
        }

        function afficherArticle(candidature) {
            const titre = candidature.offre.titre;
            const description = candidature.offre.description;
            const article = document.createElement('article');
            article.style.cssText = 'background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); aspect-ratio: 1 / 1;';

            article.innerHTML = `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <span id="offre-type" style="background: #fee2e2; color: #991b1b; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 14px;"></span>
                        <span style="background: #d1fae5; color: #065f46; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 500;">Publiée</span>
                    </div>
                    <h2 style="font-size: 18px; font-weight: 600; color: #0f172a; margin-bottom: 8px;"></h2>
                    <p style="color: #64748b; font-size: 14px; line-height: 1.5; margin: 0;"></p>
                </div>
                <div>
                    <div style="color: #94a3b8; font-size: 12px; margin-bottom: 16px;">Offre disponible</div>
                    <a id="voir-offre" style="display: block; text-align: center; background-color: #0f172a; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 500;">Voir</a>
                </div>
            `;

            article.querySelector('#offre-type').textContent = titre.toUpperCase().slice(0, 2);
            article.querySelector('h2').textContent = titre;
            article.querySelector('p').textContent = description;
            article.querySelector('#voir-offre').href = `/contrat/${candidature.id}`;
            document.getElementById('offers-grid').appendChild(article);
        }
    </script>
</body>
</html>
