<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appli RH - Tableau de bord</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" th:href="@{/home}">
                <span class="brand-mark">RH</span>
                <span>
                    <strong>Appli RH</strong>
                </span>
            </a>
            <div class="topbar-actions">
                <span class="status"><span class="status-dot"></span>
                    <span th:text="${employeeConnecte.prenom + ' ' + employeeConnecte.nom}">Utilisateur connecté</span>
                </span>
                <span class="avatar"
                      th:text="${#strings.substring(employeeConnecte.prenom, 0, 1) + #strings.substring(employeeConnecte.nom, 0, 1)}">UC</span>
                <a th:href="@{/logout}">Déconnexion</a>
            </div>
        </header>

        <div class="workspace">
            <div th:replace="~{pages/components/navbar :: nav}"></div>

            
            <main class="content">
                <div th:if="${#strings.equalsIgnoreCase(employeeConnecte.role.libelle, 'Manager')}" th:switch="${section}">
                    <div th:case="'listePostes'">
                        <div th:replace="~{pages/contenus :: listePoste}"></div>
                    </div>
                    <div th:case="'creerPoste'">
                        <div th:replace="~{pages/contenus :: creerPoste}"></div>
                    </div>
                    <div th:case="*">
                        <div th:replace="~{pages/contenus :: *}"></div>
                    </div>
                </div>
                <div th:if="${#strings.equalsIgnoreCase(employeeConnecte.role.libelle, 'Administrateur')}" th:switch="${section}">
                    <p>Ho an'ny Direction</p>
                </div>
                <div th:if="${#strings.equalsIgnoreCase(employeeConnecte.role.libelle, 'Responsable RH')}" th:switch="${section}">
                    <p>Ho an'ny Responsable RH</p>
                </div>
                <div th:if="${#strings.equalsIgnoreCase(employeeConnecte.role.libelle, 'Recruteur')}">
                    <p>Ho an'ny Recruteur</p>
                </div> 
            </main>
        </div>
    </div>
</body>
</html>
