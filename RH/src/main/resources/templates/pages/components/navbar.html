<th:block th:fragment="nav">
    <!-- Pour Manager -->
    <nav class="sidebar" aria-label="Navigation principale"
         th:if="${#strings.equalsIgnoreCase(employeeConnecte.role.libelle, 'Manager')}">

            <span class="nav-icon">⌂</span> Liste des employés
        </a>
        <a th:classappend="${section == 'listeDemandes'} ? ' active' : ''" th:href="@{/home(section='listeDemandes')}">
            <span class="nav-icon">⌂</span> Liste des demandes

            <div class="nav-heading">Raccourcis</div>

            <div class="nav-heading">Raccourcis</div>
            <a th:href="@{/}"><span class="nav-icon">↪</span> Se déconnecter</a>
        </div>
