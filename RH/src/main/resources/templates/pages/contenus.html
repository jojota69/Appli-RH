<!-- Accueil -->
<div th:fragment="*">
    <h1>Eto</h1>
</div>

<!-- liste des postes -->
<div th:fragment="listePoste">
    <section class="content-section">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Espace manager</p>
                <h1>Liste des postes</h1>
                <p class="intro">Consultez les postes disponibles dans votre équipe.</p>
            </div>
            <a class="button button-primary" th:href="@{/home(section='creerPoste')}">+ Créer un poste</a>
        </div>

        <div class="postes">
            
            <article class="poste" th:each="liste : ${listeEmployee}">
                <div class="poste-icon" th:text="${liste.nom}">IT</div>
                <div class="poste-details">
                    <h2 th:text="${liste.prenom}"></h2>
                    <p></p>
                </div>
                <span class="poste-status" th:text="${liste.role != null ? liste.role.libelle : 'Ouvert'}">Ouvert</span>
            </article>

        </div>
    </section>
</div>

<!-- Creation de poste -->
<div th:fragment="creerPoste">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Espace manager</p>
            <h1>Créer un poste</h1>
            <p class="intro">Décrivez le besoin de votre équipe.</p>
        </div>
        <a class="button button-secondary" th:href="@{/home(section='listePostes')}">Retour aux postes</a>
    </div>

    <form class="panel position-form" action="#" method="post">
        <label for="title">Intitulé du poste</label>
        <input id="title" name="title" type="text" placeholder="Ex. Développeur Java" required>

        <label for="department">Département</label>
        <input id="department" name="department" type="text" placeholder="Ex. Informatique" required>

        <label for="contractType">Type de contrat</label>
        <select id="contractType" name="contractType" required>
            <option value="">Sélectionner</option>
            <option value="cdi">CDI</option>
            <option value="cdd">CDD</option>
            <option value="stage">Stage</option>
        </select>

        <label for="reason">Motif du recrutement</label>
        <textarea id="reason" name="reason" rows="4" placeholder="Décrivez le besoin..."></textarea>

        <label for="budget">Budget demandé</label>
        <input type="number" name="budget" id="budget">

        <div class="form-actions">
            <a class="button button-secondary" th:href="@{/home(section='listePostes')}">Annuler</a>
            <button class="button button-primary" type="submit">Enregistrer le poste</button>
        </div>
    </form>
</div>
